# يبني «وِرد» للآيفون (ipa غير موقَّع) من apps/wird. التوقيع يتم عند التثبيت (Sideloadly بحساب Apple).
name: wird-ios
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'apps/wird/**', '.github/workflows/wird-ios.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Web files into the app
        run: |
          mkdir -p ios/Wird/web
          cp -R apps/wird/index.html apps/wird/fonts ios/Wird/web/
      - name: Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project Wird.xcodeproj -scheme Wird -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Wird.app Payload/
          zip -qry ../wird.ipa Payload
          ls -la ../wird.ipa
      - uses: actions/upload-artifact@v4
        with: {name: wird-ipa, path: wird.ipa}
      - name: Release
        if: github.event_name != 'pull_request'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release delete wird-ios --yes --cleanup-tag || true
          gh release create wird-ios wird.ipa --target "$GITHUB_SHA" --prerelease \
            --title "وِرد للآيفون" --notes "ملف ipa غير موقَّع. ثبّته ببرنامج Sideloadly وحساب Apple."
