<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="قائمة سور واضحة مع بحث، وتابع القراءة من حيث توقفت.">
<meta name="theme-color" content="#0F6B4F">
<title>المصحف · فهرس السور</title>
<link rel="stylesheet" href="../../assets/design.css">
<style>
  /* version 1: a big, searchable surah list → a calm reader; one "continue" card, no instructions */
  .search { position: relative; margin: 4px 0 14px; }
  .search input { width: 100%; padding-inline-start: 44px; font-size: 18px; border-radius: 999px; }
  .search span { position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .resume { display: flex; align-items: center; gap: 14px; width: 100%; margin-bottom: 14px; padding: 14px 16px; border: 0; border-radius: var(--radius);
    background: var(--brand); color: var(--brand-ink); font: inherit; text-align: start; cursor: pointer; }
  .resume b { display: block; font-size: 19px; }
  .resume small { opacity: .85; }
  .resume .go { margin-inline-start: auto; font-size: 26px; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .list button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 16px; border: 0; border-top: 1px solid var(--line);
    background: none; color: var(--ink); font: inherit; text-align: start; cursor: pointer; }
  .list li:first-child button { border-top: 0; }
  .list button:active { background: var(--brand-soft); }
  .num { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--gold-soft);
    color: var(--gold); font-weight: 700; transform: rotate(45deg); }
  .num i { font-style: normal; transform: rotate(-45deg); }
  .name { font-family: var(--font-quran); font-size: 24px; line-height: 1.3; }
  .meta { margin-inline-start: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  #reader[hidden], #home[hidden] { display: none; }
  .tools { display: flex; gap: 6px; }
  .reader-text { margin-top: 14px; padding: 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .reader-text .ayah { font-size: var(--ayah-size); }
  .ayah span[data-ayah] { scroll-margin-top: 80px; }
  .next { display: flex; justify-content: center; margin: 18px 0 8px; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<header class="app-bar">
  <a class="btn icon-btn" id="back" href="../../" aria-label="رجوع">→</a>
  <h1 id="title">فهرس السور</h1>
  <div class="tools">
    <button class="btn icon-btn" id="smaller" type="button" aria-label="تصغير الخط" hidden>ا-</button>
    <button class="btn icon-btn" id="bigger" type="button" aria-label="تكبير الخط" hidden>ا+</button>
    <button class="btn icon-btn" id="theme" type="button" aria-label="الوضع الفاتح أو الداكن">🌓</button>
  </div>
</header>

<main class="page">
  <section id="home">
    <button class="resume" id="resume" type="button" hidden><span><b id="resumeName"></b><small id="resumeAyah"></small></span><span class="go">←</span></button>
    <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="ابحث باسم السورة أو رقمها" aria-label="ابحث عن سورة"></label>
    <ul class="list" id="list"></ul>
  </section>

  <section id="reader" hidden>
    <div class="surah-header" id="surahName"></div>
    <div class="reader-text"><div class="basmala" id="basmala">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div><p class="ayah" id="text"></p></div>
    <div class="next"><button class="btn primary" id="nextSurah" type="button"></button></div>
  </section>
</main>

<script src="../../assets/quran.js"></script>
<script>
(async function () {
  var KEY = 'mushaf-list', st = {};
  try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  Quran.Theme.init($('theme'));
  var size = st.size || 30;
  function setSize(n) { size = Math.max(22, Math.min(46, n)); document.documentElement.style.setProperty('--ayah-size', size + 'px'); st.size = size; save(); }
  if (st.size) setSize(st.size);
  $('smaller').onclick = function () { setSize(size - 3); };
  $('bigger').onclick = function () { setSize(size + 3); };

  var q = await Quran.load();
  var plain = function (s) { return s.replace(/[ً-ٰٟۖ-ۭـ]/g, '').replace(/[ٱأإآ]/g, 'ا').replace(/ى/g, 'ي'); };

  function renderList(filter) {
    var f = plain((filter || '').trim()), n = parseInt(f.replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }), 10);
    var rows = q.surahs.filter(function (s) { return !f || s.id === n || plain(s.name).indexOf(f) >= 0; });
    $('list').innerHTML = rows.map(function (s) {
      return '<li><button type="button" data-s="' + s.id + '"><span class="num"><i>' + Quran.digits(s.id) + '</i></span>' +
        '<span class="name">' + s.name + '</span><span class="meta">' + Quran.digits(s.ayat.length) + ' آية · ' +
        (s.type === 'meccan' ? 'مكية' : 'مدنية') + '</span></button></li>';
    }).join('') || '<li class="empty">لا توجد سورة بهذا الاسم</li>';
  }
  $('q').addEventListener('input', function () { renderList(this.value); });
  $('list').addEventListener('click', function (e) { var b = e.target.closest('button[data-s]'); if (b) open(+b.dataset.s, 1, true); });

  function showResume() {
    if (!st.s) return;
    $('resume').hidden = false;
    $('resumeName').textContent = 'تابع: سورة ' + q.surah(st.s).name;
    $('resumeAyah').textContent = 'الآية ' + Quran.digits(st.a || 1);
  }
  $('resume').onclick = function () { open(st.s, st.a || 1, true); };

  var io;
  function open(n, a, push) {
    var s = q.surah(n);
    $('home').hidden = true; $('reader').hidden = false; $('smaller').hidden = $('bigger').hidden = false;
    $('title').textContent = 'سورة ' + s.name;
    $('surahName').textContent = 'سورة ' + s.name;
    $('basmala').hidden = n === 1 || n === 9;
    $('text').innerHTML = s.ayat.map(function (t, i) {
      return '<span data-ayah="' + n + ':' + (i + 1) + '">' + t + '</span> <span class="ayah-num">' + Quran.digits(i + 1) + '</span>';
    }).join(' ');
    $('nextSurah').hidden = n === 114;
    if (n < 114) $('nextSurah').textContent = 'سورة ' + q.surah(n + 1).name + ' ←';
    $('nextSurah').onclick = function () { open(n + 1, 1, true); };
    st.s = n; st.a = a; save();
    if (push) history.pushState({ s: n }, '', '#' + n);
    var el = a > 1 && document.querySelector('[data-ayah="' + n + ':' + a + '"]');
    if (el) el.scrollIntoView(); else scrollTo(0, 0);
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (x) { if (x.isIntersecting) { st.a = +x.target.dataset.ayah.split(':')[1]; save(); } });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('#text [data-ayah]').forEach(function (x) { io.observe(x); });
  }
  function home() {
    $('home').hidden = false; $('reader').hidden = true; $('smaller').hidden = $('bigger').hidden = true;
    $('title').textContent = 'فهرس السور'; showResume(); scrollTo(0, 0);
    if ($('q').value) { $('q').value = ''; renderList(''); }
    if (location.hash) history.replaceState(null, '', location.pathname);
  }
  $('back').addEventListener('click', function (e) { if (!$('reader').hidden) { e.preventDefault(); history.length > 1 && location.hash ? history.back() : home(); } });
  addEventListener('popstate', function () { var n = +location.hash.slice(1); if (n) open(n, 1, false); else home(); });

  renderList('');
  var h = +location.hash.slice(1);
  if (h >= 1 && h <= 114) open(h, h === st.s ? st.a : 1, false); else home();
})();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });</script>
</body>
</html>
