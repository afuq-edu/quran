<style>
:root{
  color-scheme:light;
  --sky1:#CFE0F3; --sky2:#E9F1FA; --sky3:#F8EEE4; --sun:#FFE9C8; --sil:#9DB6D3; --sil2:#C3D4E7; --water:#DCE8F4; --pillar:#F4F8FC;
  --ink:#13284A; --ink2:#4B5F80; --muted:#7D8DA8; --accent:#3D6FA3; --accent2:#2C5786; --accent-soft:#DCE8F5;
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.82); --rim:rgba(255,255,255,.85); --line:rgba(19,40,74,.08); --track:#DCE6F1;
  --gold:#C29A4E; --gold-soft:#F6EDDC; --glow:#F3D9A0;
  --c-dhikr:#3F928B; --c-pages:#3D6FA3;
  --good:#3A8C68; --warn:#B98824; --late:#C25E3C;
  --shadow:0 10px 30px -14px rgba(46,87,136,.35),0 2px 6px -2px rgba(46,87,136,.12);
  --r:24px;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-disp:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --ease:cubic-bezier(.3,.8,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky1:#0A1630; --sky2:#13284A; --sky3:#2A3558; --sun:#F3D9A0; --sil:#2E4670; --sil2:#20365C; --water:#11244A; --pillar:#1A2F55;
    --ink:#EAF1FB; --ink2:#B6C5DC; --muted:#8597B3; --accent:#7FB0E3; --accent2:#5E93CC; --accent-soft:rgba(127,176,227,.16);
    --glass:rgba(16,32,62,.62); --glass2:rgba(20,40,76,.85); --rim:rgba(255,255,255,.09); --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.1);
    --gold:#E6C27A; --gold-soft:rgba(230,194,122,.15); --glow:#F3D9A0;
    --c-dhikr:#6CC4BC; --c-pages:#7FB0E3;
    --good:#62CF9A; --warn:#E8C25A; --late:#F08A66;
    --shadow:0 12px 32px -14px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky1:#0A1630; --sky2:#13284A; --sky3:#2A3558; --sun:#F3D9A0; --sil:#2E4670; --sil2:#20365C; --water:#11244A; --pillar:#1A2F55;
  --ink:#EAF1FB; --ink2:#B6C5DC; --muted:#8597B3; --accent:#7FB0E3; --accent2:#5E93CC; --accent-soft:rgba(127,176,227,.16);
  --glass:rgba(16,32,62,.62); --glass2:rgba(20,40,76,.85); --rim:rgba(255,255,255,.09); --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.1);
  --gold:#E6C27A; --gold-soft:rgba(230,194,122,.15); --glow:#F3D9A0;
  --c-dhikr:#6CC4BC; --c-pages:#7FB0E3;
  --good:#62CF9A; --warn:#E8C25A; --late:#F08A66;
  --shadow:0 12px 32px -14px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
}
html{font-size:16px}
html[data-font="l"]{font-size:18px}
html[data-font="xl"]{font-size:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent;background:var(--sky2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:14px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- scene ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{width:100%;height:100%}
#scene .mist{filter:blur(1.6px)}
#scene .star{fill:#fff;opacity:0}
:root[data-theme="dark"] #scene .star{opacity:.75}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #scene .star{opacity:.75}}
#scene .tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
#scene .sunorb{animation:sunp 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunp{50%{transform:scale(1.08)}}
#scene .ripple{animation:wave 7s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-8px)}}

/* ---------- glass + layout ---------- */
#app{position:relative;z-index:1}
#amb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
:root[data-skin="galaxy"] #scene .star{opacity:.9}
:root[data-skin="galaxy"][data-theme="dark"] #scene .sunorb,:root[data-skin="galaxy"][data-theme="dark"] #scene circle[r="20"]{opacity:.15}
.skin.live .hint{display:flex;align-items:center;gap:4px;margin-top:4px;color:var(--gold);font-weight:600}
.skin.live .hint svg{width:12px;height:12px;flex:none}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + var(--top-gap,0px) + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.view.enter>*{animation:rise .6s var(--ease) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}.view.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glass,.card,.tile,.set{background:var(--glass);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--rim);box-shadow:var(--shadow)}
.card{border-radius:var(--r);padding:16px 18px}
.round-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);color:var(--accent2);flex:none}
:root[data-theme="dark"] .round-btn{color:var(--accent)}
.round-btn svg{width:22px;height:22px}
.h{margin:0;font-weight:700;font-size:1.08rem;line-height:1.35}
.sub{margin:0;color:var(--muted);font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent2);white-space:nowrap}
:root[data-theme="dark"] .chip{color:var(--accent)}
.chip svg{width:14px;height:14px}
.chip.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.late{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:99px;font-weight:600;font-size:.95rem;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent2));box-shadow:0 10px 22px -10px var(--accent2),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s var(--spring)}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:none}
.btn.soft{background:var(--glass2);color:var(--accent2);box-shadow:none;border:1px solid var(--rim)}
:root[data-theme="dark"] .btn.soft{color:var(--accent)}
.btn.gold{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 70%,#fff),var(--gold));color:#2a1c00;box-shadow:0 10px 22px -12px var(--gold)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:.86rem}
.note{margin:0;color:var(--muted);font-size:.8rem}

/* ---------- home ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between}
.arch{position:relative;margin:-40px auto 0;width:min(66%,280px);text-align:center;padding:50px 14px 14px;isolation:isolate}
.arch svg.frame{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
.arch .moon{width:30px;height:30px;margin:0 auto 6px;color:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
:root[data-theme="dark"] .arch .moon{color:var(--glow);filter:drop-shadow(0 0 10px var(--glow))}
.arch h1{margin:0;font-size:1.4rem;font-weight:700;line-height:1.35;white-space:nowrap}
.arch p{margin:2px 0 0;color:var(--ink2);font-size:.92rem}
.mode{display:flex;gap:4px;width:min(100%,280px);margin:2px auto 0;padding:4px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow)}
.mode button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:99px;font-weight:600;font-size:.92rem;color:var(--ink2);transition:background .3s,color .3s}
.mode button svg{width:18px;height:18px}
.mode button[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent2));color:#fff;box-shadow:0 6px 14px -8px var(--accent2)}
.dial{position:relative;width:min(70vw,280px);aspect-ratio:1;margin:6px auto 0;border-radius:50%;display:block;padding:0;user-select:none;-webkit-user-select:none}
.dial svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .ring .prog{transition:stroke-dashoffset .8s var(--ease)}
.dial .ring .knob{transition:transform .8s var(--ease)}
.dial .disc{position:absolute;inset:11%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 50% 30%,var(--glass2),var(--glass));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--rim);box-shadow:inset 0 2px 14px rgba(255,255,255,.6),0 18px 40px -20px rgba(46,87,136,.5);transition:transform .1s}
:root[data-theme="dark"] .dial .disc{box-shadow:inset 0 2px 14px rgba(255,255,255,.05),0 18px 40px -20px rgba(0,0,0,.8)}
.dial.tappable:active .disc{transform:scale(.97)}
.dial .ic{width:64px;height:auto;color:var(--accent2)}
:root[data-theme="dark"] .dial .ic{color:var(--accent)}
.dial .big{font-size:clamp(2.8rem,14vw,3.9rem);font-weight:700;line-height:1;letter-spacing:.01em}
.dial .lb{font-size:1.02rem;color:var(--ink2)}
.dial .sm{font-size:.78rem;color:var(--muted)}
.dial .wv{position:absolute;inset:11%;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:wv .7s var(--ease) forwards;pointer-events:none}
@keyframes wv{to{transform:scale(1.18);opacity:0}}
.dial.run .disc::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04);opacity:.4}}
.primary{display:flex;justify-content:center;margin-top:4px}
.primary .btn{width:min(100%,340px);min-height:60px;font-size:1.15rem;font-weight:600}
.primary .btn svg{width:24px;height:24px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sq{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:20px;font-size:.86rem;font-weight:500;color:var(--ink2);transition:transform .15s var(--spring)}
.sq:active{transform:scale(.95)}
.sq .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent2);color:var(--accent2)}
:root[data-theme="dark"] .sq .ci{border-color:var(--accent);color:var(--accent)}
.sq .ci svg{width:20px;height:20px}
.sq:disabled{opacity:.45}
.goalc{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.goalc .gi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent2)}
:root[data-theme="dark"] .goalc .gi{color:var(--accent)}
.goalc .gi svg{width:24px;height:24px}
.goalc .gv small{display:block;color:var(--muted);font-size:.8rem}
.goalc .gv b{font-size:1.5rem;font-weight:700;line-height:1.2}
.goalc .gv b small{display:inline;font-size:.82rem;font-weight:500}
.gbar{grid-column:1/-1}
.gbar .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:22px}
.gbar .meta b{color:var(--accent2)}
:root[data-theme="dark"] .gbar .meta b{color:var(--accent)}
.pline{grid-column:1/-1;margin:0;font-size:.88rem;font-weight:600}
.pline.late{color:var(--late)} .pline.on,.pline.ahead{color:var(--good)} .pline.done{color:var(--gold)} .pline.none,.pline.rest{color:var(--muted)}
.week{display:flex;gap:6px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wd i{width:100%;max-width:32px;aspect-ratio:1;border-radius:50%;background:var(--track);position:relative;overflow:hidden}
.wd i b{position:absolute;inset-inline:0;bottom:0;height:var(--p);background:linear-gradient(0deg,var(--accent2),color-mix(in srgb,var(--accent) 60%,#fff))}
.wd.full i{box-shadow:0 0 0 2px var(--glass2),0 0 0 3.5px var(--gold)}
.wd.today i{outline:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.wd.rest i{background:repeating-linear-gradient(45deg,var(--track) 0 4px,transparent 4px 8px)}
.wd small{font-size:.68rem;color:var(--muted)}

/* ---------- pace track ---------- */
.path{--st:var(--good)}
.path.st-late{--st:var(--late)} .path.st-warn{--st:var(--warn)} .path.st-rest,.path.st-restday{--st:var(--muted)} .path.st-done{--st:var(--gold)}
.path .big{margin:4px 0 2px;font-size:1.25rem;font-weight:700;line-height:1.35;color:var(--st)}
.track{--st:var(--accent);position:relative;height:12px;border-radius:99px;background:var(--track);margin:30px 6px 30px}
.track .fl{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--st) 55%,#fff),var(--st));transition:width .8s var(--ease)}
.track .gap{position:absolute;inset-block:0;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--late) 40%,transparent) 0 4px,transparent 4px 8px)}
.track .st{position:absolute;top:50%;width:2px;height:18px;margin-top:-9px;margin-inline-start:-1px;background:color-mix(in srgb,var(--ink) 15%,transparent)}
.track .st span{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);font-size:.64rem;color:var(--muted);white-space:nowrap}
.track .should{position:absolute;top:-7px;bottom:-7px;width:3px;margin-inline-start:-1.5px;background:var(--gold);border-radius:2px}
.track .should span{position:absolute;bottom:100%;margin-bottom:5px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;white-space:nowrap;color:var(--gold)}
.track .you{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;margin-inline-start:-11px;border-radius:50%;background:#fff;border:4px solid var(--st);box-shadow:0 2px 8px rgba(0,0,0,.2);transition:inset-inline-start .8s var(--ease)}
.track .you span{position:absolute;top:100%;margin-top:6px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;white-space:nowrap;color:var(--st)}
.track.late .you::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--late);animation:halo 1.6s ease-out infinite}
@keyframes halo{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
.need{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.need span{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:4px 11px;border-radius:12px;background:var(--glass2);border:1px solid var(--rim);color:var(--ink)}
.need span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1 1 auto}
.eta{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink2);margin:6px 0 0}
.eta svg{width:16px;height:16px;color:var(--gold);flex:none}
.quote{margin:0;text-align:center;font-size:.98rem;color:var(--ink2);padding:4px 14px}
.quote small{display:block;font-size:.75rem;color:var(--muted)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(19,40,74,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{--c:var(--accent);position:fixed;inset-inline:0;bottom:0;z-index:41;max-height:90vh;overflow-y:auto;background:var(--glass2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:30px 30px 0 0;border-top:1px solid var(--rim);box-shadow:0 -20px 50px -20px rgba(19,40,74,.45);padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .45s var(--ease)}
:root[data-theme="dark"] .sheet{background:rgba(14,28,56,.94)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin:0 auto 4px}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--c)}
.sh-head .ico svg{width:24px;height:24px}
.sh-head h2{margin:0;font-size:1.25rem;line-height:1.3}
.sh-head p{margin:0;color:var(--muted);font-size:.85rem}
.sh-head .round-btn{margin-inline-start:auto;width:42px;height:42px}
.mini{background:var(--glass);border:1px solid var(--rim);border-radius:20px;padding:6px 16px 12px}
.mini .track{margin:28px 4px 28px}
.bead-pad,.string,.hg-row{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cb{padding:6px 15px;border-radius:99px;background:var(--glass2);border:1px solid var(--rim);font-weight:600;font-size:.88rem;min-height:38px;color:var(--ink2)}
.cb[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff}
.quick{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px}
.qb{min-height:54px;border-radius:18px;font-weight:700;font-size:clamp(.92rem,3.8vw,1.06rem);background:var(--glass);border:1px solid var(--rim);color:var(--accent2);box-shadow:var(--shadow);transition:transform .15s var(--spring);min-width:0}
:root[data-theme="dark"] .qb{color:var(--accent)}
.qb:active{transform:scale(.92)}
.custom{display:flex;gap:8px}
.custom input{flex:1;min-width:0;height:48px;border-radius:99px;border:1px solid var(--rim);background:var(--glass);padding-inline:18px;font-size:1rem;color:var(--ink)}
.custom input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.lbl{margin:0;font-size:.82rem;font-weight:600;color:var(--muted)}
.tline{display:none}

/* ---------- reports / log ---------- */
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.ptitle h1{margin:0;font-size:1.6rem;font-weight:700}
.ptitle p{margin:0;color:var(--muted);font-size:.86rem}
.top{display:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow)}
.seg button{flex:1;min-height:40px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent2));color:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile small{color:var(--muted);font-size:.8rem}
.tile b{font-size:1.55rem;line-height:1.2}
.tile b small{font-size:.78rem;font-weight:500}
.d{font-size:.76rem;font-weight:600}
.d.up{color:var(--good)} .d.down{color:var(--late)} .d.eq{color:var(--muted)}
.ins{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.92rem}
.ins li svg{width:18px;height:18px;color:var(--gold);margin-top:3px}
.readout{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.88rem;margin:8px 0}
.plot{position:relative;height:180px;margin-inline-end:34px;margin-top:16px}
.grid div{position:absolute;inset-inline:0;border-top:1px solid var(--line)}
.grid span{position:absolute;inset-inline-end:-34px;transform:translateY(-50%);width:30px;font-size:.7rem;color:var(--muted)}
.goal{position:absolute;inset-inline:0;border-top:2px dashed var(--gold);pointer-events:none}
.goal span{position:absolute;inset-inline-start:0;top:-18px;font-size:.7rem;color:var(--gold);font-weight:700}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bar i{display:block;width:100%;height:var(--v);min-height:2px;border-radius:8px 8px 3px 3px;background:linear-gradient(0deg,var(--col),color-mix(in srgb,var(--col) 55%,#fff));transform-origin:50% 100%;animation:grow .7s var(--ease) both}
.bar.low i{opacity:.45}
.bar[aria-pressed="true"] i{opacity:1;box-shadow:0 0 0 2px var(--glass2),0 0 0 3.5px var(--col)}
@keyframes grow{from{transform:scaleY(0)}}
.xl{display:flex;gap:3px;margin-inline-end:34px;margin-top:4px}
.xl span{flex:1;font-size:.66rem;color:var(--muted);text-align:center;white-space:nowrap;min-width:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h .round-btn{width:36px;height:36px;box-shadow:none}
.cal-wd,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd span{font-size:.68rem;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border-radius:50%;font-size:.8rem;font-weight:600;display:grid;place-items:center;position:relative;background:var(--track);color:var(--ink2);min-width:0}
.cal button[data-l="1"]{background:color-mix(in srgb,var(--accent) 25%,var(--track))}
.cal button[data-l="2"]{background:color-mix(in srgb,var(--accent) 50%,var(--track))}
.cal button[data-l="3"]{background:color-mix(in srgb,var(--accent) 75%,var(--track));color:#fff}
.cal button[data-l="4"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent2));color:#fff;box-shadow:0 0 0 2px var(--gold)}
.cal button.fut{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.sel{outline:3px solid var(--gold);outline-offset:1px}
.cal button.rest{background:repeating-linear-gradient(45deg,var(--track) 0 4px,transparent 4px 8px)}
.dayd{margin-top:12px;padding:12px;border-radius:16px;background:var(--glass2);border:1px solid var(--rim)}
.hb{display:grid;grid-template-columns:78px 1fr 46px;gap:10px;align-items:center;font-size:.86rem;margin-top:8px}
.hb>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:10px;border-radius:99px;background:var(--track);position:relative;overflow:hidden}
.hb .tr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--col,var(--accent))}
.hb b{text-align:end;font-size:.82rem}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log li:last-child{border-bottom:0}
.log li>i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.log small{color:var(--muted)}
.icon-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-x svg{width:16px;height:16px}
.dayrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:start}
.dayrow .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--accent-soft);color:var(--accent2)}
.dayrow .dot.full{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent2));color:#fff;box-shadow:0 0 0 2px var(--gold)}
.dayrow b{display:block;font-size:.95rem}
.dayrow small{color:var(--muted);font-size:.8rem}
.dayrow .chev{width:18px;height:18px;color:var(--muted);transition:transform .25s}
.dayrow[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* ---------- settings ---------- */
.set{border-radius:var(--r);overflow:hidden}
.set>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px;font-weight:600;font-size:1.02rem}
.set>summary::-webkit-details-marker{display:none}
.set>summary .si{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent2)}
:root[data-theme="dark"] .set>summary .si{color:var(--accent)}
.set>summary .si svg{width:20px;height:20px}
.set>summary .chev{margin-inline-start:auto;width:18px;height:18px;color:var(--muted);transition:transform .25s}
.set[open]>summary .chev{transform:rotate(180deg)}
.set-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.goalrow{--c:var(--accent);display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--glass2);border:1px solid var(--rim)}
.goalrow .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--c)}
.goalrow .ico svg{width:22px;height:22px}
.goalrow input.name{width:100%;min-width:0;border:0;background:transparent;font-weight:700;font-size:1rem;padding:0;color:var(--ink)}
.goalrow small{color:var(--muted);font-size:.78rem}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--glass);border:1px solid var(--rim);box-shadow:var(--shadow);font-size:1.15rem;font-weight:700;color:var(--accent2)}
.stepper output{min-width:48px;text-align:center;font-weight:700}
.goalin{width:76px;height:38px;border-radius:12px;border:1px solid var(--rim);background:var(--glass2);text-align:center;font-weight:700;font-size:1.05rem;color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.goalin::-webkit-inner-spin-button,.goalin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.goalin:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--ink2);min-width:0}
.fld small{font-weight:400;color:var(--muted)}
.inp{height:44px;border-radius:14px;border:1px solid var(--rim);background:var(--glass2);padding-inline:12px;font-size:.95rem;width:100%;min-width:0;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{height:100px;padding:10px;font-size:.75rem;direction:ltr;text-align:left;font-family:ui-monospace,monospace}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.94rem}
.sw-row small{display:block;color:var(--muted);font-size:.78rem}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw input:checked+span{background:var(--accent2)}
.sw input:checked+span::after{transform:translateX(-22px)}
.confirm{padding:12px;border-radius:14px;border:1.5px dashed var(--late);display:flex;flex-direction:column;gap:8px;font-size:.88rem}

/* ---------- nav ---------- */
.nav{position:fixed;z-index:30;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px) + var(--bot-gap,0px));background:var(--glass2);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border-top:1px solid var(--rim);box-shadow:0 -10px 30px -18px rgba(19,40,74,.35)}
.nav .ind{display:none}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;font-size:.76rem;font-weight:500;color:var(--muted)}
.nav button .ni{display:grid;place-items:center;width:56px;height:34px;border-radius:99px;transition:background .3s}
.nav button svg{width:23px;height:23px}
.nav button[aria-selected="true"]{color:var(--accent2);font-weight:700}
:root[data-theme="dark"] .nav button[aria-selected="true"]{color:var(--accent)}
.nav button[aria-selected="true"] .ni{background:var(--accent-soft)}
.nav .dot{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--late);box-shadow:0 0 0 2px var(--glass2)}

/* ---------- toast / overlays ---------- */
.toast{position:fixed;z-index:60;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px) + var(--bot-gap,0px));display:flex;justify-content:center;pointer-events:none}
.toast div{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:480px;padding:12px 18px;border-radius:99px;background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--rim);color:var(--ink);font-weight:600;font-size:.92rem;box-shadow:var(--shadow);animation:tin .45s var(--spring)}
.toast div.gold{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 70%,#fff),var(--gold));color:#2a1c00;border-color:transparent}
.toast div svg{width:18px;height:18px;flex:none;color:var(--accent2)}
.toast div.gold svg{color:#2a1c00}
.toast button{font-weight:700;text-decoration:underline;text-underline-offset:3px}
@keyframes tin{from{transform:translateY(20px) scale(.92);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.overlay{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(70% 50% at 50% 38%,color-mix(in srgb,var(--glow) 35%,var(--sky2)),var(--sky2));animation:fade .35s ease}
.overlay h2{margin:0;font-size:1.7rem}
.overlay p{margin:0;color:var(--ink2);max-width:36ch}
.overlay .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px) + var(--top-gap,0px));inset-inline-end:16px}
.overlay .sum{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.overlay .sum span{padding:6px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--rim);font-weight:600;font-size:.9rem}
.overlay .medal{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff,var(--glow) 60%,var(--gold));box-shadow:0 0 0 10px color-mix(in srgb,var(--glow) 30%,transparent),0 20px 50px -10px var(--gold);color:#5a3d00;animation:pop .7s var(--spring)}
.overlay .medal svg{width:60px;height:60px}
#splash{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--sky2);pointer-events:none;animation:splash .6s ease .7s forwards}
#splash b{font-size:3rem;font-weight:700;color:var(--accent2)}
@keyframes splash{to{opacity:0;visibility:hidden}}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.14;transform:scale(0);animation:rip .6s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn,.qb,.cb,.sq,.seg button,.nav button,.cal button,.mode button{position:relative;overflow:hidden}
.pop{animation:pop .35s var(--spring)}
@keyframes pop{40%{transform:scale(1.1)}}
@media (max-width:370px){.trio .sq{font-size:.78rem}.arch h1{font-size:1.35rem}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---------- journey (pace) v7 ---------- */
.jr{--js:var(--accent)}
.jr.js-late{--js:var(--late)} .jr.js-good{--js:var(--good)} .jr.js-gold{--js:var(--gold)} .jr.js-mute{--js:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent2)}
:root[data-theme="dark"] .chip.on{color:var(--accent)}
.chip.mute{background:var(--track);color:var(--muted)}
.jr .h{margin:0}
.jban{display:flex;align-items:center;gap:12px;margin:12px 0 4px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--js) 12%,var(--glass2));border:1px solid color-mix(in srgb,var(--js) 30%,transparent)}
.jban .jic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--js);color:#fff;box-shadow:0 6px 16px -8px var(--js)}
.jban .jic svg{width:22px;height:22px}
.jban b{display:block;font-size:1.18rem;font-weight:700;color:var(--js);line-height:1.3}
.jban small{display:block;font-size:.84rem;color:var(--ink2)}
.jr.js-late .jban .jic{animation:jpulse 1.8s ease-in-out infinite}
@keyframes jpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--late) 45%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.jc{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.jc .jg{stroke:var(--line);stroke-width:1}
.jc .jl{font-size:10px;fill:var(--muted);font-family:inherit}
.jc .jl.nx{fill:var(--ink);font-weight:700}
.jc .jt{font-size:10.5px;fill:var(--muted);font-family:inherit;font-weight:600}
.jc .jt.you{fill:var(--accent2);font-weight:700}
:root[data-theme="dark"] .jc .jt.you{fill:var(--accent)}
.jc .jt.pd{fill:var(--gold);font-weight:700}
.jc .jgoal{stroke:var(--gold);stroke-width:1.2;stroke-dasharray:3 4;opacity:.8}
.jc .jplan{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round;opacity:.9}
.jc .jact{fill:none;stroke:var(--accent2);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
:root[data-theme="dark"] .jc .jact{stroke:var(--accent)}
.jc .jdebt{fill:var(--late);opacity:.32}
.jc .jcred{fill:var(--good);opacity:.4}
.jc .jnow{stroke:var(--ink);stroke-opacity:.25;stroke-width:1.2;stroke-dasharray:2 3}
.jc .jpd{fill:var(--glass2);stroke:var(--gold);stroke-width:3}
.jc .jyou{fill:#fff;stroke:var(--accent2);stroke-width:4}
.jr.js-late .jc .jyou{stroke:var(--late)}
.jleg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.72rem;color:var(--muted);margin:2px 0 10px}
.jleg span{display:inline-flex;align-items:center;gap:5px}
.jleg i{display:inline-block;width:14px;height:0;border-top:3px solid var(--accent2)}
.jleg i.lp{border-top:2px dashed var(--gold)}
.jleg i.ld{height:9px;border:0;border-radius:3px;background:color-mix(in srgb,var(--late) 35%,transparent)}
.jleg i.lc{height:9px;border:0;border-radius:3px;background:color-mix(in srgb,var(--good) 35%,transparent)}
.stns{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.stn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;border-radius:14px;background:var(--glass2);border:1px solid var(--rim);text-align:center;min-width:0}
.stn b{font-size:.76rem;font-weight:700;white-space:nowrap}
.stn small{font-size:.62rem;color:var(--muted);white-space:nowrap}
.stn span{font-size:.92rem;font-weight:700;margin-top:2px}
.stn i{height:20px;display:grid;place-items:center;font-style:normal}

  background:linear-gradient(180deg,var(--lc34) 0%,var(--lc35) 55%,var(--lc36) 100%);border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 34px -12px var(--lc37),0 0 0 6px var(--lc38),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s var(--spring)}
.ly-go svg{width:22px;height:22px;flex:none}
.ly-go:active,.ly-mini:active,.ly-pill:active{transform:scale(.96)}
.ly-go.on{background:linear-gradient(180deg,var(--lc39) 0%,var(--lc40) 60%,var(--lc41) 100%)}
.ly-mini{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--lc24);background:rgba(255,255,255,.08);border:1px solid var(--rim)}
.ly-mini[hidden]{display:grid!important;visibility:hidden}
.ly-mini svg{width:20px;height:20px}
.ly-trio{gap:8px;flex-wrap:wrap}
.ly-pill{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 16px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--lc42);background:rgba(255,255,255,.08);border:1px solid var(--rim)}
.ly-pill svg{width:18px;height:18px}
:root[data-look="layl"] #v-today .schips{justify-content:center;margin-top:-4px}
:root[data-look="layl"] #v-today .schips button{background:rgba(255,255,255,.07);border:1px solid var(--rim);color:var(--lc13)}
:root[data-look="layl"] #v-today .schips button[aria-pressed="true"]{background:var(--lc43);color:#fff}

.ly-two{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.ly-week,.ly-streak{cursor:pointer;padding:12px 12px 10px}
.ly-wh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ly-wh b{font-size:.9rem}
.ly-wh i{width:20px;height:20px;color:var(--lc22)}
.ly-wh svg{width:100%;height:100%}
.ly-wt{display:block;text-align:center;font-size:1.45rem;font-weight:700;margin-top:2px;line-height:1.2}
.ly-wo{display:block;text-align:center;font-size:.72rem;color:var(--lc26)}
.ly-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;direction:rtl}
.ly-wd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ly-wd i{position:relative;display:block;width:12px;height:38px;border-radius:5px;background:rgba(255,255,255,.10);overflow:hidden}
.ly-wd s{position:absolute;inset-inline:0;bottom:0;border-radius:5px;background:linear-gradient(0deg,var(--lc44),var(--lc45))}
.ly-wd.full s{background:linear-gradient(0deg,var(--lc10),var(--lc46));box-shadow:0 0 10px var(--lc33)}
.ly-wd.today i{box-shadow:0 0 0 1.5px var(--lc47)}
.ly-wd small{font-size:.58rem;color:var(--lc48);white-space:nowrap;line-height:1.1}
.ly-wd.fut small{color:var(--lc49)}
.ly-streak{display:flex;flex-direction:column;align-items:center;text-align:center}
.ly-fl{width:30px;height:36px;filter:drop-shadow(0 0 10px rgba(255,170,70,.7))}
.ly-fl svg{width:100%;height:100%}
.ly-st-t{font-size:.86rem;margin-top:2px}
.ly-st-n{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:2px;color:var(--lc15)}
.ly-st-n b{font-size:1.55rem;color:#fff;font-weight:700;white-space:nowrap}
.ly-st-n .lr{width:16px;height:34px;opacity:.6}
.ly-st-n .lr svg{width:100%;height:100%}
.ly-st-n .ll{transform:scaleX(-1)}
.ly-streak small{font-size:.76rem;color:var(--lc31)}

.ly-rh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ly-rh i{width:24px;height:24px;color:var(--lc24)}
.ly-rh svg{width:100%;height:100%}
.ly-rh b{flex:1;font-size:1rem}
.ly-more{min-height:36px;padding:2px 12px;border-radius:99px;font-size:.78rem;color:var(--lc13);background:rgba(255,255,255,.07);border:1px solid var(--rim)}
.ly-rec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ly-rec li{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.ly-rec li>div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ly-rec li>div b{font-size:.95rem}
.ly-rec li small{color:var(--lc26);font-size:.76rem}
.ly-rec li>b{font-size:1.05rem;font-weight:600}
.ly-rec li.now{background:var(--lc28);border-color:var(--lc50)}
.ly-rec li.empty{justify-content:center;text-align:center}
.ly-ri{flex:none;width:44px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.08);color:#E8C77A}
.ly-ri svg{width:26px;height:26px}

/* ---------- dock ---------- */
:root[data-look="layl"] .nav{display:block;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px) + var(--bot-gap,0px))}
.ly-dock{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:linear-gradient(180deg,var(--lc51),var(--lc52));border:1px solid var(--rim);box-shadow:0 18px 40px -16px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.1)}
:root[data-look="layl"] .ly-dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:6px 2px;border-radius:20px;font-size:.76rem;font-weight:500;color:var(--lc18)}
:root[data-look="layl"] .ly-dock .ni{width:auto;height:auto;background:none!important}
:root[data-look="layl"] .ly-dock .ni svg{width:24px;height:24px}
:root[data-look="layl"] .ly-dock button[aria-selected="true"]{color:#fff;font-weight:700;background:linear-gradient(180deg,var(--lc53),var(--lc54));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px -8px var(--lc55)}
:root[data-look="layl"] .ly-dock .dot{position:absolute;top:8px;inset-inline-end:26%;width:8px;height:8px;border-radius:50%;background:var(--late)}


@media (max-width:370px){.ly-big{font-size:2.3rem}.ly-two{grid-template-columns:1.4fr 1fr;gap:8px}.ly-wd small{font-size:.52rem}.ly-go{min-width:0;padding:10px 22px}}

<style>
#wInst{position:fixed;z-index:90;inset-inline:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto;padding:10px 12px 10px 10px;border-radius:20px;
  background:var(--glass2,rgba(30,30,84,.92));color:var(--ink,#fff);border:1px solid var(--rim,rgba(255,255,255,.2));box-shadow:0 18px 40px -16px rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  font-family:var(--f-body,system-ui);direction:rtl;animation:wInstIn .5s cubic-bezier(.3,.8,.3,1)}
@keyframes wInstIn{from{opacity:0;transform:translateY(-16px)}}
#wInst img{width:42px;height:42px;border-radius:11px;flex:none}
#wInst div{flex:1;min-width:0;line-height:1.35}
#wInst b{display:block;font-size:.95rem}
#wInst small{display:block;font-size:.78rem;opacity:.8}
#wInst .go{flex:none;min-height:44px;padding:8px 18px;border-radius:99px;border:0;font:inherit;font-weight:700;color:#fff;background:linear-gradient(180deg,#B7A9FF,#8C78F0);box-shadow:0 8px 20px -10px #8C78F0}
#wInst .x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:none;color:inherit;font-size:1.3rem;opacity:.7}
</style>
<script>
(function(){
  if(!/^https?:$/.test(location.protocol))return;               // the native iPhone shell has its own copy
  var sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  /* ---- auto update: a new version is picked up by itself, no new APK ---- */
  if('serviceWorker' in navigator){
    var had=!!navigator.serviceWorker.controller,done=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!done){done=true;location.reload();}});
    addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
      function skip(w){if(w)w.postMessage('skip');}
      skip(reg.waiting);
      reg.addEventListener('updatefound',function(){var w=reg.installing;if(w)w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)skip(w);});});
      function chk(){reg.update().catch(function(){});}
      document.addEventListener('visibilitychange',function(){if(!document.hidden)chk();});setInterval(chk,30*60000);
    }).catch(function(){});});
  }
  /* ---- full screen (owner 2026-11-13): an installed copy hides the status bar and the navigation bar ----
     the manifest asks for fullscreen; a copy installed before that (standalone) goes full screen on the first touch */
  if(matchMedia('(display-mode: standalone)').matches&&document.documentElement.requestFullscreen){
    var fs=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(function(){});};
    addEventListener('pointerup',fs,{passive:true});
  }
  sa=sa||matchMedia('(display-mode: fullscreen)').matches;
  /* ---- install bar ---- */
  if(sa)return;
  var KEY='wird.instX';try{if(+localStorage.getItem(KEY)>Date.now())return;}catch(e){}
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),ev=null;
  function bar(sub,btn){if(document.getElementById('wInst'))return;var d=document.createElement('div');d.id='wInst';d.setAttribute('role','dialog');d.setAttribute('aria-label','تثبيت التطبيق');
    d.innerHTML='<img src="icon-192.png" alt=""><div><b>ثبّت وِرد على هاتفك</b><small>'+sub+'</small></div>'+(btn?'<button class="go">تثبيت</button>':'')+'<button class="x" aria-label="إخفاء">×</button>';
    document.body.appendChild(d);
    d.querySelector('.x').onclick=function(){d.remove();try{localStorage.setItem(KEY,String(Date.now()+3*864e5));}catch(e){}};
    var g=d.querySelector('.go');if(g)g.onclick=function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){ev=null;d.remove();});};}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;setTimeout(function(){bar('يعمل بلا إنترنت ويتحدّث وحده',true);},1600);});
  addEventListener('appinstalled',function(){var d=document.getElementById('wInst');if(d)d.remove();});
  if(ios)setTimeout(function(){bar('اضغط زر المشاركة <span aria-hidden="true">⎙</span> ثم «إضافة إلى الشاشة الرئيسية»',false);},1800);
})();
</script>
