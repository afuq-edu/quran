<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="آية واحدة كبيرة في الشاشة، وانتقل بلمسة أو سحب.">
<meta name="theme-color" content="#0F6B4F">
<title>المصحف · آية آية</title>
<link rel="stylesheet" href="../../assets/design.css">
<style>
  /* version 2: one ayah fills the screen; next/previous sit under the thumb; the surah picker is a bottom sheet */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  .pick { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 0; background: none;
    color: var(--ink); font: inherit; font-size: 19px; font-weight: 700; cursor: pointer; }
  .pick small { color: var(--muted); font-weight: 400; }
  .progress { height: 4px; background: var(--surface-2); }
  .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; touch-action: pan-y; }
  .badge { display: inline-grid; place-items: center; width: 54px; height: 54px; margin-bottom: 18px; border: 2px solid var(--gold); border-radius: 50%;
    color: var(--gold); font-size: 20px; font-weight: 700; }
  .verse { max-width: 680px; font-family: var(--font-quran); font-size: calc(var(--ayah-size) * 1.15); line-height: 2.1; transition: opacity .18s; }
  .verse.out { opacity: 0; }
  .bm { font-family: var(--font-quran); font-size: 22px; color: var(--muted); margin-bottom: 8px; }
  .dock { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line); }
  .dock .btn { min-height: 56px; font-size: 18px; white-space: nowrap; padding-inline: 14px; }
  .dock .size { display: flex; gap: 6px; }
  .sheet { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(0,0,0,.35); }
  .sheet.open { display: block; }
  .panel { position: absolute; inset-inline: 0; bottom: 0; max-height: 80dvh; display: flex; flex-direction: column; background: var(--surface);
    border-radius: 22px 22px 0 0; padding: 10px 16px 16px; }
  .grip { width: 44px; height: 5px; margin: 0 auto 10px; border-radius: 99px; background: var(--line); }
  .panel input { width: 100%; margin-bottom: 10px; border-radius: 999px; font-size: 18px; }
  .chips { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding-bottom: 8px; }
  .chips button { min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; text-align: start; }
  .chips button.cur { border-color: var(--brand); background: var(--brand-soft); }
  .chips b { color: var(--gold); min-width: 2ch; }
  .chips span { font-family: var(--font-quran); font-size: 20px; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<header class="app-bar">
  <a class="btn icon-btn" href="../../" aria-label="رجوع">→</a>
  <button class="pick" id="pick" type="button" aria-haspopup="dialog"><span id="sname"></span><small>▾</small></button>
  <button class="btn icon-btn" id="theme" type="button" aria-label="الوضع الفاتح أو الداكن">🌓</button>
</header>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<main class="stage" id="stage" aria-live="polite">
  <div class="badge" id="num"></div>
  <div class="bm" id="bm" hidden>بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>
  <p class="verse" id="verse"></p>
</main>

<nav class="dock">
  <button class="btn" id="prev" type="button" aria-label="الآية السابقة">→ السابقة</button>
  <div class="size">
    <button class="btn icon-btn" id="smaller" type="button" aria-label="تصغير الخط">ا-</button>
    <button class="btn icon-btn" id="bigger" type="button" aria-label="تكبير الخط">ا+</button>
  </div>
  <button class="btn primary" id="next" type="button" aria-label="الآية التالية">التالية ←</button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-label="اختر السورة">
  <div class="panel">
    <div class="grip"></div>
    <input id="q" type="search" placeholder="🔍 اسم السورة أو رقمها" aria-label="ابحث عن سورة">
    <div class="chips" id="chips"></div>
  </div>
</div>

<script src="../../assets/quran.js"></script>
<script>
(async function () {
  var KEY = 'mushaf-focus', st = { s: 1, a: 1, size: 30 };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  Quran.Theme.init($('theme'));
  function setSize(n) { st.size = Math.max(22, Math.min(46, n)); document.documentElement.style.setProperty('--ayah-size', st.size + 'px'); save(); }
  setSize(st.size);
  $('smaller').onclick = function () { setSize(st.size - 3); };
  $('bigger').onclick = function () { setSize(st.size + 3); };

  var q = await Quran.load();
  function show() {
    var s = q.surah(st.s), v = $('verse');
    v.classList.add('out');
    setTimeout(function () {
      v.innerHTML = '<span data-ayah="' + st.s + ':' + st.a + '">' + s.ayat[st.a - 1] + '</span>';
      v.classList.remove('out');
    }, 120);
    $('sname').textContent = 'سورة ' + s.name;
    $('num').textContent = Quran.digits(st.a);
    $('bm').hidden = !(st.a === 1 && st.s !== 1 && st.s !== 9);
    $('bar').style.width = (100 * st.a / s.ayat.length) + '%';
    $('prev').disabled = st.s === 1 && st.a === 1;
    $('next').disabled = st.s === 114 && st.a === q.count(114);
    $('next').textContent = st.a === s.ayat.length && st.s < 114 ? 'سورة ' + q.surah(st.s + 1).name + ' ←' : 'التالية ←';
    save();
  }
  function step(d) {
    var a = st.a + d, s = st.s;
    if (a > q.count(s)) { if (s === 114) return; s++; a = 1; }
    if (a < 1) { if (s === 1) return; s--; a = q.count(s); }
    st.s = s; st.a = a; show();
  }
  $('next').onclick = function () { step(1); };
  $('prev').onclick = function () { step(-1); };
  addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') step(1); if (e.key === 'ArrowRight') step(-1); });
  var x0 = null;
  $('stage').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', function (e) {
    if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) step(dx > 0 ? 1 : -1);          // like turning a page of the mushaf: swipe right for the next ayah
  });

  function chips(f) {
    var plain = function (s) { return s.replace(/[ً-ٰٟۖ-ۭـ]/g, '').replace(/[ٱأإآ]/g, 'ا').replace(/ى/g, 'ي'); };
    f = plain(f.trim()); var n = parseInt(f.replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }), 10);
    $('chips').innerHTML = q.surahs.filter(function (s) { return !f || s.id === n || plain(s.name).indexOf(f) >= 0; }).map(function (s) {
      return '<button type="button" data-s="' + s.id + '"' + (s.id === st.s ? ' class="cur"' : '') + '><b>' + Quran.digits(s.id) + '</b><span>' + s.name + '</span></button>';
    }).join('');
  }
  function sheet(open) {
    $('sheet').classList.toggle('open', open);
    if (open) { $('q').value = ''; chips(''); var c = $('chips').querySelector('.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
  }
  $('pick').onclick = function () { sheet(true); };
  $('sheet').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-s]');
    if (b) { st.s = +b.dataset.s; st.a = 1; show(); sheet(false); }
    else if (e.target === $('sheet')) sheet(false);
  });
  $('q').addEventListener('input', function () { chips(this.value); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') sheet(false); });
  show();
})();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });</script>
</body>
</html>
